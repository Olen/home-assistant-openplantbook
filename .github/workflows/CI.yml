name: CI

on:
  # Only run push on main/master; feature branches are covered by pull_request,
  # so a push to a branch with an open PR doesn't run the matrix twice. Push on
  # main is also what the Auto Release workflow keys on, so it must stay.
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: "0 0 15 * *"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install linters
        run: uv pip install black ruff --system

      - name: Check formatting (black)
        run: black . --check --fast --diff

      - name: Check linting (ruff)
        run: ruff check .

  test:
    name: Tests (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    # Non-blocking for the experimental "beta" matrix entry; required otherwise.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest HA version - uses current pytest-homeassistant-custom-component.
          # HA 2026.3+ requires Python 3.14; on 3.13 this resolves to HA 2026.2.
          - ha-version: "latest"
            pytest-ha-version: ""
            python-version: "3.14"
          # Minimum HA version from hacs.json (2025.8.0)
          # pytest-homeassistant-custom-component 0.13.270 supports HA 2025.8.x
          - ha-version: "2025.8"
            pytest-ha-version: "==0.13.270"
            python-version: "3.13"
          # Latest HA prerelease/beta (NON-BLOCKING, see continue-on-error), so
          # breakage in an upcoming HA release surfaces here before users see it.
          # Tested with the official pytest-home-assistant, which replaced
          # pytest-homeassistant-custom-component in HA 2026.11.
          - ha-version: "beta"
            python-version: "3.14"
            experimental: true
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv pip install --system --no-cache pytest pytest-cov
          # Install integration dependencies
          uv pip install --system --no-cache json-timeseries openplantbook-sdk

      - name: Install pytest-homeassistant-custom-component
        if: matrix.ha-version != 'beta'
        run: uv pip install --system --no-cache "pytest-homeassistant-custom-component${{ matrix.pytest-ha-version }}"

      - name: Pin aiodns/pycares (HA 2025.8 only)
        if: matrix.ha-version == '2025.8'
        # Known working versions for HA 2025.8; newer HA requires newer ones
        run: uv pip install --system --no-cache "aiodns==3.5.0" "pycares==4.11.0"

      - name: Install the newest HA prerelease and pytest-home-assistant (beta job only)
        if: matrix.ha-version == 'beta'
        # pytest-home-assistant must match the installed HA. It is not on PyPI
        # yet, so it comes from the core tag of that HA version.
        run: |
          uv pip install --system --no-cache --prerelease=allow --upgrade homeassistant
          HA_VERSION=$(python -c "from homeassistant.const import __version__; print(__version__)")
          uv pip install --system --no-cache "pytest-home-assistant @ git+https://github.com/home-assistant/core@${HA_VERSION}#subdirectory=packages/pytest-home-assistant"

      - name: Show installed versions
        run: |
          python -c "from homeassistant.const import __version__; print(f'Home Assistant version: {__version__}')"
          pip show pycares aiodns | grep -E "^(Name|Version)"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=custom_components/openplantbook --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  validate:
    name: Validate Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
